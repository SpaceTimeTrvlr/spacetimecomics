<table cellspacing="0" cellpadding="0" width="100%" height="100%">
	<tr>
		<td align="center">
		<h1><u><font face="Futura Bk" color="#FFFFFF">BEGINNINGS</font></u></h1>
		<p align="left"><font face="Futura Bk" size="4" color="#FFFFFF">In 
		August of 2016, a young, cringey SpaceTimeTrvlr created his first real 
		comic strip: <i>Zackary and Delainie</i>&#39;s &quot;Oh, I&#39;m Terrible!&quot;. He would 
		continue to create <i>Z&amp;D</i> comics throughout his days in middle 
		school, and would create two more series, <i>Extreme Stupidity</i> and
		<i>Stupid Stickz</i>, in 2018. Zack, the person who would eventually 
		assume the &quot;SpaceTimeTrvlr&quot; alias a couple years into the future, only 
		had his comics seen by his family and classmates at the time, but on a 
		cold February evening in 2019, this would all change...</font></p>
		<p align="left">&nbsp;</p>
		<h1><u><font face="Futura Bk" color="#FFFFFF">ZHC IS BORN</font></u></h1>
		<p align="left"><font face="Futura Bk" size="4" color="#FFFFFF">Feeling 
		motivated to show his comics to the world, Zack went to Google Sites on 
		his crappy old Chromebook and got to work on a website where he could 
		put said comics. Then, like a burst of cold air on a dark winter night, 
		Zack Hinchey Comics came onto the scene! For the first two years of its 
		existence, ZHC was solely used as a place for this SpaceTimeTrvlr to 
		post his comics to the interwebs. For a while it seemed that nothing new 
		was on the horizon, but then, something came...</font><h1>&nbsp;</h1>
		<h1><u><font face="Futura Bk" color="#FFFFFF">ZHC 2.0</font></u></h1>
		<p align="left"><font face="Futura Bk" size="4" color="#FFFFFF">In 
		February 2021, Zack began adding more features to his once bare bones 
		comic website, including a Cartoons section to post his animations, a 
		Vault to function as an archive of sorts for the history of his art 
		career, along with many other things to help ZHC feel more fleshed out. 
		This expansion was dubbed &quot;Zack Hinchey Comics 2.0&quot; at the time, and 
		along with all the new additions to the site itself, a new character was 
		introduced to the ZHCverse. VJ, that quirky music and video-obsessed 
		girl, made her ZHC debut alongside the ZHC 2.0 expansion. Although she 
		was first created in November 2020, her first official appearance in a 
		comic was in <i>Z&amp;D</i>&#39;s &quot;An Interruption...&quot;, which was released three 
		months later. With so many new features added, it seemed that 
		SpaceTimeTrvlr was satisfied with how things were for a while. But in 
		August of 2025, this would change...</font><p align="left">&nbsp;<h1>&nbsp;</h1>
		<h1><u><font face="Futura Bk" color="#FFFFFF">ENTER SPACETIME COMICS</font></u></h1>
		<p align="left"><font face="Futura Bk" size="4" color="#FFFFFF">As 
		SpaceTimeTrvlr got older, he grew increasingly unsatisfied with the 
		status quo in regards to his comic website. He could only do so much 
		with what the tools provided by Google Sites allowed for. Thus, he 
		decided to leave his old ship behind and start building a new one, using 
		an old desktop website builder program that allowed for much more 
		customization and personalization than the bland, flat, and corporate 
		Google Sites ever had. Enter Microsoft FrontPage 2003! Although it&#39;s 
		taking a while for our now-more-experienced SpaceTimeTrvlr to learn the 
		ropes of this quirky old program, it&#39;s allowed him to make his new comic 
		website look even better than old Google Sites-based version. And so, 
		the story continues...</font></td>
	</tr>
</table>
