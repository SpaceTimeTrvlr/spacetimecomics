 <v:textbox>
<table cellspacing="0" cellpadding="0" width="100%" height="100%">
	<tr>
		<td align="center">
		<h1 align="center"><u><b>
		<font face="Futura Bk" size="6" color="#FFFFFF">Welcome!</font></b></u></h1>
		<p align="left"><font face="Futura Bk" size="4" color="#FFFFFF">Hey all, 
		Zack (aka SpaceTimeTrvlr) here, welcoming you to Spacetime Comics, the 
		new and improved version of Zack Hinchey Comics! That&#39;s what I plan for 
		it to be, at least. This site is currently under construction for now, 
		but by the time it&#39;s finished, I plan for it to be a complete 
		replacement for the old Google Sites version of ZHC. </font></p>
		<p align="left"><font face="Futura Bk" size="4" color="#FFFFFF">While 
		Google Sites has served me well for the past six or so years, I&#39;ve grown 
		increasingly unsatisfied with how limited it is, especially in the 
		customization department. That&#39;s why I&#39;m making Spacetime Comics the 
		old-fashioned way: Using a 20+-year-old website builder (Microsoft 
		FrontPage 2003, to be exact) and GitHub Pages!</font></p>
		<p align="left"><font face="Futura Bk" size="4" color="#FFFFFF">Since 
		this new site is still under construction, you may encounter some 
		unfinished pages and links to the old site as placeholders. These will 
		be gradually replaced as I get closer to a complete package, though. The 
		old ZHC will also remain in a state of &quot;limited support&quot; (only updating 
		the weekly features and such) until STC is complete.</font></p>
		<p align="left"><font face="Futura Bk" size="4" color="#FFFFFF">That 
		being said, I hope you enjoy what I have on Spacetime Comics so far, and 
		until next time, peace out!</font></p>
		<p>&nbsp;</td>
	</tr>
</table>
 </v:textbox>

	<tr>
		<td align="center">
		<h1 align="center"><u><font face="Futura Bk" color="#FFFFFF">Birthday 
		Update!</font></u></h1>
		<p align="left"><font face="Futura Bk" size="4" color="#FFFFFF">This 
		Monday (6/22) marks 21 years since a baby SpaceTimeTrvlr escaped his 
		mother&#39;s womb and came into the world at large. To celebrate, I&#39;ve added 
		a new page to Spacetime Comics. Introducing the Drawings page! I created 
		this page because I wanted to make a definitive archive of pretty much 
		every drawing I&#39;ve posted publicly since I created the original Google 
		Sites version of STC back in 2019. Plus, I don&#39;t think Twitter should be 
		the only option for people to access my past work because it&#39;s not 
		exactly the best place for such things. Hopefully, this should keep my 
		artwork outside of comics and flipnotes more organized than it was 
		before.</font></p>
		<p align="left"><font face="Futura Bk" size="4" color="#FFFFFF">When 
		Spacetime Comics originally launched in February 2019, the mission was 
		to create an all-encompassing hub for my comics. Since then, that 
		mission has expanded into many other aspects of my art career. Now that 
		my standalone drawings are here, I&#39;m one step closer to making STC the 
		definitive place on the internet for all of my artistic efforts!</font></p>
		<p>&nbsp;</td>
